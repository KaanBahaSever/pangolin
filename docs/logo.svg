<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Pangolin</title>
  <desc id="desc">A pangolin curled into a ball that forms a padlock: its tail is the shackle and its nose is the keyhole.</desc>

  <!-- Tile -->
  <rect width="512" height="512" rx="116" fill="#141A2E"/>

  <!-- Tail, curled over the top as the shackle -->
