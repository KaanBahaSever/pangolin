name: Release

# Pushing a tag such as v0.1.0 tests and builds Pangolin on each platform and
# publishes the packages, with checksums, as a GitHub release. The website's
# download buttons point at the latest release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CGO_ENABLED: "1"
  CGO_CFLAGS: "-w"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-amd64
          - os: macos-latest
            name: macos-arm64
          - os: ubuntu-22.04 # an older glibc keeps the binary usable on more distributions
            name: linux-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev
      - run: go test ./...
      - name: Build and package
        shell: bash
        run: |
          mkdir -p dist/pangolin
          cp LICENSE README.md dist/pangolin/
          if [ "$RUNNER_OS" = "Windows" ]; then
            go build -trimpath -ldflags "-s -w -H=windowsgui" -o dist/pangolin/pangolin.exe ./cmd/pangolin
            (cd dist && 7z a -tzip "../pangolin-${{ matrix.name }}.zip" pangolin)
          else
            go build -trimpath -ldflags "-s -w" -o dist/pangolin/pangolin ./cmd/pangolin
            tar -czf "pangolin-${{ matrix.name }}.tar.gz" -C dist pangolin
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: pangolin-${{ matrix.name }}
          path: |
            pangolin-*.zip
            pangolin-*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Checksums
        run: sha256sum pangolin-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" pangolin-* SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "Pangolin $GITHUB_REF_NAME" \
            --generate-notes
