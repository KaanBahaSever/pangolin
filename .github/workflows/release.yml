name: Release

# Pushing a tag such as v1.2.3 tests and packages Pangolin on each platform
# and publishes the packages, with checksums, as a GitHub release. The
# website's download buttons point at the latest release.
#
# Running the workflow by hand builds the same packages as artifacts without
# publishing anything, to try out packaging changes.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-amd64
          - os: macos-latest
            name: macos-universal
          - os: ubuntu-22.04 # an older glibc keeps the binary usable on more distributions
            name: linux-amd64
          - os: ubuntu-22.04-arm
            name: linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev
      - name: Test
        shell: bash
        run: CGO_ENABLED=1 CGO_CFLAGS=-w go test ./...
      - name: Package
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-dev"
          fi
          bash packaging/build.sh "$version"
      - uses: actions/upload-artifact@v4
        with:
          name: pangolin-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Checksums
        run: sha256sum pangolin-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" pangolin-* SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "Pangolin $GITHUB_REF_NAME" \
            --generate-notes
